[project]
name = "gpt-vuln-analyzer"
version = "2.0.0"
description = "Nmap and multi-provider LLM integrated vulnerability scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # AI providers
    "openai>=1.0",
    "anthropic>=0.30",
    "google-genai>=1.0",
    "ollama>=0.1",
    # Scanning / analysis
    "python-nmap>=0.7",
    "scapy>=2.5",
    "dnspython>=2.3",
    "requests>=2.28",
    "pyjwt>=2.6",
    # CLI / UX
    "rich>=13.4",
    "cowsay>=5.0",
    "customtkinter>=5.2",
    "python-dotenv>=1.0",
    "docker>=6.1",
    "pydantic-ai>=2.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.uv]
package = false
